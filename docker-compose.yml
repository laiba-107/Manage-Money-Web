version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: manage_money_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: manage_money
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/002_seed_categories.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    networks:
      - manage_money_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manage_money"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching & sessions (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: manage_money_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - manage_money_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # NestJS API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: manage_money_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-securepassword123}
      DB_NAME: manage_money
      DB_SSL: false
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: 30d
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/v1/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      MOBILE_DEEP_LINK: ${MOBILE_DEEP_LINK:-managemoney://auth/callback}
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - manage_money_network
    volumes:
      - api_logs:/app/logs
      - api_uploads:/app/uploads

  # Static website served by nginx
  web:
    image: nginx:1.25-alpine
    container_name: manage_money_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - manage_money_network

volumes:
  postgres_data:
  redis_data:
  api_logs:
  api_uploads:

networks:
  manage_money_network:
    driver: bridge
